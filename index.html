<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매트 영업이익 계산기</title>
<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  padding: 20px;
}
.container {
  max-width: 800px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 10px;
}
h2 {
  margin-bottom: 15px;
}
input {
  width: 100%;
  padding: 10px;
  margin: 5px 0 15px 0;
  font-size: 16px;
}
.result {
  background: #fafafa;
  padding: 10px;
  border-radius: 6px;
  margin-top: 10px;
}
.highlight {
  font-weight: bold;
  color: #d62828;
}
</style>
</head>

<body>
<div class="container">
<h2>매트 영업이익 계산기</h2>

<label>공급가</label>
<input type="number" id="supply" oninput="calc()">

<label>판매가</label>
<input type="number" id="sell" oninput="calc()">

<label>시공비용</label>
<input type="number" id="install" oninput="calc()">

<div class="result" id="output"></div>
</div>

<script>
const MARKETING = 130000;

function calc() {

  const supply = Number(document.getElementById("supply").value) || 0;
  const sell = Number(document.getElementById("sell").value) || 0;
  const install = Number(document.getElementById("install").value) || 0;

  const supplyVAT = supply * 1.1;
  const sellVAT = sell * 1.05;
  const installVAT = install * 1.1;

  function rowCalc(qty) {

    const marketingPer = MARKETING / qty;

    // ✅ 현금 장당수익
    const cashPer = sell - install - marketingPer - supply;
    const cashTotal = cashPer * qty;

    // ✅ VAT 장당수익 (최종 수정 반영)
    let base =
      (sellVAT / 0.909)
      - (installVAT / 0.909)
      - marketingPer
      - (supplyVAT / 0.909);

    let correction =
      - (sellVAT * 0.091)
      + (installVAT * 0.091)
      + (supplyVAT * 0.090);

    const vatPer = base + correction;
    const vatTotal = vatPer * qty;

    return { cashPer, cashTotal, vatPer, vatTotal };
  }

  const r600 = rowCalc(103);
  const r1200 = rowCalc(26);

  document.getElementById("output").innerHTML = `
  <h3>600 SIZE (103장)</h3>
  장당수익(현금): <span class="highlight">${r600.cashPer.toLocaleString()}원</span><br>
  총 영업이익(현금): ${r600.cashTotal.toLocaleString()}원<br><br>
  장당수익(VAT): <span class="highlight">${r600.vatPer.toLocaleString()}원</span><br>
  총 영업이익(VAT): ${r600.vatTotal.toLocaleString()}원

  <hr>

  <h3>1200 SIZE (26장)</h3>
  장당수익(현금): <span class="highlight">${r1200.cashPer.toLocaleString()}원</span><br>
  총 영업이익(현금): ${r1200.cashTotal.toLocaleString()}원<br><br>
  장당수익(VAT): <span class="highlight">${r1200.vatPer.toLocaleString()}원</span><br>
  총 영업이익(VAT): ${r1200.vatTotal.toLocaleString()}원
  `;
}
</script>

</body>
</html>
